name: Publish VSCode Extension

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build VSIX
    runs-on: ubuntu-latest

    outputs:
      vsix_name: ${{ steps.vars.outputs.vsix_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install packaging tools
        run: npm install --no-save @vscode/vsce ovsx

      - name: Read package metadata
        id: vars
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          VSIX_NAME="${NAME}-${VERSION}.vsix"

          echo "vsix_name=$VSIX_NAME" >> $GITHUB_OUTPUT

      - name: Package extension
        run: |
          npx vsce package -o "${{ steps.vars.outputs.vsix_name }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: ${{ steps.vars.outputs.vsix_name }}

  publish:
    name: Publish Extension
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install publishing tools
        run: npm install --no-save @vscode/vsce ovsx

      - name: Publish to Visual Studio Marketplace
        run: |
          npx vsce publish \
            --packagePath "${{ needs.build.outputs.vsix_name }}" \
            -p ${{ secrets.VSCE_PAT }}

      - name: Publish to OpenVSX
        run: |
          npx ovsx publish \
            "${{ needs.build.outputs.vsix_name }}" \
            -p ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release and upload VSIX
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ needs.build.outputs.vsix_name }}
          generate_release_notes: true